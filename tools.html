<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSV Analyzer</title>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<style>
body { font-family: Arial; margin: 20px; }
#previewTable table, #anomalyTable table { border-collapse: collapse; width: 100%; margin-top: 10px; }
#previewTable th, #previewTable td,
#anomalyTable th, #anomalyTable td {
  border: 1px solid #ccc; padding: 4px 6px; font-size: 13px;
}
#controls { margin-top: 20px; padding: 10px; border: 1px solid #bbb; }
input, select { padding: 4px; margin: 4px; }
button { padding: 6px 10px; margin: 5px; cursor: pointer; }
</style>
</head>
<body>

<h2>CSV Analyzer</h2>

<input type="file" id="csvFile" accept=".csv" />
<br><br>

<div id="previewTable"></div>

<div id="controls">

<h3>Descriptive Statistics</h3>
<button onclick="showStats()">Show Stats</button>
<div id="statsBox"></div>

<h3>Anomaly Detection</h3>
<select id="anomalyCol"></select>
<select id="method">
  <option value="zscore">Z-Score</option>
  <option value="iqr">IQR</option>
</select>

<label>Z-Threshold:</label>
<input id="zThreshold" type="number" step="0.1" value="3" style="width:80px" />

<button onclick="findAnomalies()">Find</button>
<button onclick="downloadAnomalies()">Download Anomalies</button>

<div id="anomalyTable"></div>

<h3>Unique Counts (Categorical)</h3>
<select id="uniqueCol"></select>
<button onclick="showUnique()">Show Unique Counts</button>
<div id="uniqueBox"></div>

<h3>Filter Rows</h3>
<select id="filterCol"></select>
<select id="filterOp">
  <option value="=">=</option>
  <option value="!=">!=</option>
  <option value=">">></option>
  <option value="<"><</option>
  <option value=">=">>=</option>
  <option value="<="><=</option>
  <option value="contains">contains</option>
</select>
<input type="text" id="filterVal" placeholder="Value" />
<button onclick="applyFilter()">Filter</button>
<div id="filterResult"></div>

<h3>Group By + Aggregate</h3>
<select id="groupCol"></select>
<select id="aggCol"></select>
<select id="aggFunc">
  <option value="sum">Sum</option>
  <option value="avg">Average</option>
  <option value="count">Count</option>
</select>
<button onclick="doGroup()">Run</button>
<div id="groupResult"></div>

<h3>Date / Time Trend Chart</h3>
<select id="dateCol"></select>
<select id="valueCol"></select>
<button id="plotTime">Plot</button>
<div id="chart"></div>

</div>

<script>
let data = [];
let headers = [];

// LOAD CSV
document.getElementById("csvFile").addEventListener("change", function () {
  const file = this.files[0];
  const reader = new FileReader();

  reader.onload = function (e) {
    const lines = e.target.result.split(/\r?\n/).filter(x => x.trim() !== "");
    headers = lines[0].split(",");
    data = lines.slice(1).map(r => {
      const cols = r.split(",");
      let obj = {};
      headers.forEach((h, i) => obj[h] = cols[i]);
      return obj;
    });

    populateDropdowns();
    renderTable(data, "previewTable");
  };

  reader.readAsText(file);
});

// Populate all dropdowns
function populateDropdowns() {
  const dropdowns = ["anomalyCol", "uniqueCol", "filterCol", "groupCol", "aggCol", "dateCol", "valueCol"];
  dropdowns.forEach(id => {
    let d = document.getElementById(id);
    d.innerHTML = "";
    headers.forEach(h => {
      let o = document.createElement("option");
      o.value = h;
      o.textContent = h;
      d.appendChild(o);
    });
  });
}

// Table Renderer
function renderTable(arr, target) {
  if (arr.length === 0) {
    document.getElementById(target).innerHTML = "<p>No data</p>";
    return;
  }

  let html = "<table><tr>";
  headers.forEach(h => html += `<th>${h}</th>`);
  html += "</tr>";

  arr.forEach(row => {
    html += "<tr>";
    headers.forEach(h => html += `<td>${row[h]}</td>`);
    html += "</tr>";
  });

  html += "</table>";
  document.getElementById(target).innerHTML = html;
}

// Stats
function showStats() {
  let txt = "";
  headers.forEach(h => {
    let vals = data.map(r => parseFloat(r[h])).filter(x => !isNaN(x));
    if (vals.length > 0) {
      let sum = vals.reduce((a, b) => a + b, 0);
      let avg = sum / vals.length;
      txt += `<p><b>${h}</b> → Count: ${vals.length}, Min: ${Math.min(...vals)}, Max: ${Math.max(...vals)}, Avg: ${avg.toFixed(3)}</p>`;
    }
  });
  document.getElementById("statsBox").innerHTML = txt;
}

// Anomalies
let anomalyResults = [];

function findAnomalies() {
  const col = document.getElementById("anomalyCol").value;
  const method = document.getElementById("method").value;
  const th = Number(document.getElementById("zThreshold").value) || 3;

  let arr = data.map((r, i) => ({
    index: i + 1,
    value: parseFloat(r[col]),
    row: r
  })).filter(x => !isNaN(x.value));

  anomalyResults = [];

  if (method === "zscore") {
    let mean = arr.reduce((a, b) => a + b.value, 0) / arr.length;
    let std = Math.sqrt(arr.reduce((s, x) => s + (x.value - mean) ** 2, 0) / arr.length);

    arr.forEach(a => {
      const z = std === 0 ? 0 : Math.abs((a.value - mean) / std);
      if (z > th) anomalyResults.push({ index: a.index, value: a.value, z: z.toFixed(3) });
    });
  }

  if (method === "iqr") {
    let sorted = arr.map(x => x.value).sort((a, b) => a - b);
    let q1 = sorted[Math.floor(sorted.length * 0.25)];
    let q3 = sorted[Math.floor(sorted.length * 0.75)];
    let iqr = q3 - q1;

    let lower = q1 - 1.5 * iqr;
    let upper = q3 + 1.5 * iqr;

    arr.forEach(a => {
      if (a.value < lower || a.value > upper)
        anomalyResults.push({ index: a.index, value: a.value });
    });
  }

  renderAnomalyTable();
}

// Render anomalies
function renderAnomalyTable() {
  if (anomalyResults.length === 0) {
    document.getElementById("anomalyTable").innerHTML = "<p>No anomalies found.</p>";
    return;
  }

  let html = "<table><tr><th>Row</th><th>Value</th><th>Z</th></tr>";
  anomalyResults.forEach(a => {
    html += `<tr><td>${a.index}</td><td>${a.value}</td><td>${a.z || ""}</td></tr>`;
  });
  html += "</table>";

  document.getElementById("anomalyTable").innerHTML = html;
}

// Download anomalies CSV
function downloadAnomalies() {
  if (anomalyResults.length === 0) return alert("No anomalies to download.");

  let csv = "row,value,z\n";
  anomalyResults.forEach(a => {
    csv += `${a.index},${a.value},${a.z || ""}\n`;
  });

  let blob = new Blob([csv], { type: "text/csv" });
  let link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "anomalies.csv";
  link.click();
}

// Unique counts
function showUnique() {
  const col = document.getElementById("uniqueCol").value;
  let counts = {};

  data.forEach(r => {
    let v = r[col];
    counts[v] = (counts[v] || 0) + 1;
  });

  let html = "<ul>";
  for (let k in counts) html += `<li>${k}: ${counts[k]}</li>`;
  html += "</ul>";

  document.getElementById("uniqueBox").innerHTML = html;
}

// Filter
function applyFilter() {
  const col = document.getElementById("filterCol").value;
  const op = document.getElementById("filterOp").value;
  const val = document.getElementById("filterVal").value;

  let r = data.filter(row => {
    let v = row[col];

    if (op === "contains") return String(v).includes(val);
    if (!isNaN(v) && !isNaN(val)) {
      let a = parseFloat(v), b = parseFloat(val);
      if (op === ">") return a > b;
      if (op === "<") return a < b;
      if (op === ">=") return a >= b;
      if (op === "<=") return a <= b;
    }
    if (op === "=") return v == val;
    if (op === "!=") return v != val;

    return false;
  });

  renderTable(r, "filterResult");
}

// Group + Aggregate
function doGroup() {
  const gCol = document.getElementById("groupCol").value;
  const aCol = document.getElementById("aggCol").value;
  const func = document.getElementById("aggFunc").value;

  let groups = {};

  data.forEach(r => {
    let g = r[gCol];
    let v = parseFloat(r[aCol]);
    if (!groups[g]) groups[g] = [];
    if (!isNaN(v)) groups[g].push(v);
  });

  let html = "<table><tr><th>" + gCol + "</th><th>Result</th></tr>";

  for (let g in groups) {
    let vals = groups[g];
    let result = 0;

    if (func === "sum") result = vals.reduce((a, b) => a + b, 0);
    if (func === "avg") result = vals.reduce((a, b) => a + b, 0) / vals.length;
    if (func === "count") result = vals.length;

    html += `<tr><td>${g}</td><td>${result}</td></tr>`;
  }

  html += "</table>";
  document.getElementById("groupResult").innerHTML = html;
}

// Time chart
document.getElementById("plotTime").addEventListener("click", () => {
  const d = document.getElementById("dateCol").value;
  const v = document.getElementById("valueCol").value;

  let x = data.map(r => r[d]);
  let y = data.map(r => parseFloat(r[v])).filter(n => !isNaN(n));

  Plotly.newPlot("chart", [{
    x: x,
    y: y,
    type: "scatter",
    mode: "lines+markers"
  }]);
});
</script>

</body>
</html>
